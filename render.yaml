# Render blueprint — https://render.com/docs/blueprint-spec
#
# Push this repository to GitHub, then in Render choose
# "New → Blueprint" and point it at the repo. Render reads this file,
# builds the service, and gives you an https:// URL. The WebSocket address is
# the same host with `wss://` and `/ws`, e.g.
#   https://playhub.onrender.com  ->  wss://playhub.onrender.com/ws
#
# The free instance type sleeps when idle; the first visitor after a nap waits
# a few seconds for it to wake.
services:
  - type: web
    name: playhub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: node server/src/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Leave ALLOWED_ORIGINS unset to accept any origin. Set it to your
      # GitHub Pages URL to restrict who may open a socket, e.g.
      #   https://<user>.github.io
      - key: ALLOWED_ORIGINS
        sync: false
      # Signs the login tokens. Generated on first run if unset, but the free
      # plan's disk resets on every deploy — which would log everybody out —
      # so Render generates a stable one for you here instead.
      - key: AUTH_SECRET
        generateValue: true
      # The free plan has no persistent disk, so accounts live only until the
      # next deploy. To keep them: add a Disk in the Render dashboard, then set
      # DATA_DIR here to its mount path (e.g. /var/data). Left unset on purpose
      # — pointing it at a path with no disk behind it would look like it
      # worked while quietly losing every account.
      # - key: DATA_DIR
      #   value: /var/data
