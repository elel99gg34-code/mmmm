name: Deploy to GitHub Pages

# Publishes the web client. There is no build step: the client is plain ES
# modules that import the same rule engines the server uses, so the repository
# root *is* the site. Everything except online play works from Pages alone.
#
# One-time setup: repository Settings → Pages → Source → "GitHub Actions".

# Triggers on any branch but only publishes from the repository's default
# branch, whatever it happens to be called — hardcoding `main` silently does
# nothing in a repo whose default is named something else. A manual run from
# the Actions tab publishes whichever branch you pick.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble site
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the rules still pass before publishing them
        run: node tests/run.js

      - name: Stage the site
        run: |
          mkdir -p _site
          # The client is index.html plus the app and the shared engines it
          # imports. Nothing else needs to be public.
          cp index.html _site/
          cp .nojekyll _site/
          cp -r app _site/
          cp -r shared _site/
          # A 404 that serves the app keeps deep links working on Pages.
          cp index.html _site/404.html
          # Pages reads the custom domain from a CNAME file inside the published
          # artifact. Without this copy every deploy silently clears
          # Settings → Pages → Custom domain and the site stops answering there.
          if [ -f CNAME ]; then
            cp CNAME _site/
            echo "Custom domain: $(cat CNAME)"
          fi
          echo "Staged $(find _site -type f | wc -l) files"

      # This is the one step that needs a human first. Without Pages enabled it
      # fails with "Get Pages site failed", which says nothing useful, so catch
      # it and print the actual instruction instead.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true

      - name: Explain how to enable Pages
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled::Open Settings → Pages, set Source to \"GitHub Actions\", then re-run this workflow. Nothing else needs changing — the site itself built fine."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
